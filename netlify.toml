[build]
  base = "web-hub"
  publish = "landing-page"
  functions = "web-hub/netlify/functions"
  command = "npm run build"

[[redirects]]
  from = "/submit"
  to = "/.netlify/functions/submit"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/fleet"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/rules"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/.netlify/functions/api"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
